login_case:
  - name: 正常登录
    method: POST
    url: /api/login
    json:
      username: admin
      password: "123456"    #加双引号！！
    assert:
      code: 200
      msg: "登录成功"

  - name: 密码错误登录
    method: POST
    url: /api/login
    json:
      username: admin
      password: "666666"   #加双引号
    assert:
      code: 500
      msg: "密码错误"
